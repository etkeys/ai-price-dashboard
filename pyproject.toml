[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-price-dashboard"
version = "0.2.0"
description = "A Flask dashboard for tracking AI-related prices."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1.3",
    "Flask-SQLAlchemy>=3.1.1",
    "Flask-Migrate>=4.1.0",
    "python-dotenv>=1.2.2",
    "gunicorn>=26.0.0",
    "SQLAlchemy>=2.0.51",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[project.scripts]
ai-price-dashboard = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "run*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --disable-warnings"

[tool.coverage.run]
source = ["app"]
